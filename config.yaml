# Parámetros de clonemap. Cada etapa lee de acá; nada hardcodeado en los scripts.
seed: 42

paths:
  gapfinder_db: ~/dev/projects/gapfinder/data/corpus.db   # SOLO LECTURA (?mode=ro)
  gapfinder_env: ~/dev/projects/gapfinder/.env            # se lee GITHUB_TOKEN en runtime, no se copia
  data: data
  clones: data/clones

selection:
  pushed_after: "2024-10-21"        # último push en los últimos 2 años
  snapshot_date: "2026-10-21"       # fin fijo de las ventanas de búsqueda (reproducible y cacheable)
  llm_created_after: "2024-01-01"
  target_per_domain: 1750           # meta 1.500–2.000
  control_n: 300                    # grupo control: Python del corpus sin Django ni LLM en dependencias
  domains: [django, llm]           # ETL fuera (22-oct)
  min_py_lines: 2000
  max_py_lines: 50000
  supplement_min_stars: 3           # Search API para django y llm (el corpus es casi todo >=100 estrellas)

mode: pilot                         # pilot | full (también --mode). Salidas en data/<modo>/

pilot:
  quotas: {django: 70, llm: 130}    # 200 repos
  overrides:                        # con 200 repos casi no hay clusters de 8 owners
    cluster: {min_cluster_size: 5, min_samples: 3}
    report: {min_owners: 3}

download:
  workers: 6
  timeout_s: 300

parse:
  min_nonblank_lines: 10            # subido de 6 (22-oct)
  template_file_min_repos: 5        # un archivo idéntico en >=N repos se trata como template
  workers: 6

dedup:
  num_perm: 64
  threshold: 0.8
  shingle_tokens: 5

embed:
  model: Salesforce/codet5p-110m-embedding
  max_tokens: 256                   # medido en M2: 512 tok → 13 fn/s, 256 tok bs16 → 20 fn/s
  batch_size: 16
  chunk: 5000
  fp16: true

cluster:
  min_cluster_size: 10
  min_samples: 5
  umap_n_neighbors: 15
  umap_n_components: 5
  prefilter: auto                   # on | off | auto (si hay más de prefilter_auto_above funciones)
  prefilter_auto_above: 600000      # ~470k x 256-d entra en RAM; el prefiltro solo si hace falta
  knn_k: 30
  knn_sim: 0.60                     # calibrado en el piloto: 0,80 perdía el 92 % de los clusters grandes
  knn_min_other_owners: 2

report:
  top_k: 50
  min_owners: 8
  examples_per_cluster: 5
  specific_min_owners: 8            # vista por dominio: owners del dominio principal
  max_q: 0.05                       # q de Benjamini-Hochberg
  laplace_alpha: 1
  generic_min_ctrl_prev: 0.03       # "genérico": >= 3 % de los owners de control aparecen en el cluster
  generic_max_enr_ctrl: 5.0         #   y además enriquecimiento vs control < este valor
  framework_min_frac: 0.6           # "idiomático del framework": >= 60 % métodos de clases base de Django/DRF
